<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - College Library Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-brand">
            <a href="/">College Library</a>
        </div>
        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/login" class="active">Login</a>
            <a href="/register">Member Registration</a>
        </nav>
    </header>

    <main class="container" style="max-width: 460px; margin-top: 3rem;">
        <div class="card">
            <div class="card-header">
                <h1 class="card-title" style="font-size: 1.4rem;">Account Login</h1>
            </div>

            <!-- Notification banner (hidden by default) -->
            <div id="login-alert" class="alert" style="display: none;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="role">Select Role</label>
                    <select id="role" class="form-control" required>
                        <option value="member">Student / Member</option>
                        <option value="admin">Admin / Librarian</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username (e.g. member1 or admin)" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
            </form>

            <div style="margin-top: 1.25rem; font-size: 0.9rem; text-align: center;">
                <p>Don't have a member account? <a href="/register" id="register-link">Register here</a></p>
            </div>
        </div>

        <!-- Quick Demo Credentials Box -->
        <div class="card" style="font-size: 0.85rem; background: #f1f5f9;">
            <p style="margin-bottom: 0.25rem;"><strong>Demo Credentials:</strong></p>
            <p style="margin-bottom: 0.25rem;">• <strong>Admin/Librarian:</strong> <code>admin</code> / <code>admin123</code></p>
            <p style="margin-bottom: 0;">• <strong>Student/Member:</strong> <code>member1</code> / <code>member123</code></p>
        </div>
    </main>

    <footer>
        <p>College Library Management System &copy; 2026</p>
    </footer>

    <script src="/js/api.js"></script>
    <script>
        // Check for URL query message (e.g. after successful registration)
        const params = new URLSearchParams(window.location.search);
        const msg = params.get('msg');
        if (msg) {
            const isSuccess = msg.toLowerCase().includes('success');
            showAlert('login-alert', msg, isSuccess ? 'success' : 'info');
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert('login-alert');

            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            if (!username || !password) {
                showAlert('login-alert', 'Please fill in all fields.', 'danger');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Signing in...';

            const res = await apiCall('/api/auth/login', 'POST', {
                role: role,
                username: username,
                password: password
            });

            btn.disabled = false;
            btn.innerText = 'Sign In';

            if (!res.ok) {
                showAlert('login-alert', res.data.error || 'Invalid username or password.', 'danger');
                return;
            }

            // Redirect based on authenticated role
            if (res.data.role === 'admin') {
                window.location.href = '/admin/dashboard';
            } else {
                window.location.href = '/member/dashboard';
            }
        });
    </script>
</body>
</html>
